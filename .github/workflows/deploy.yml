name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Redundant PR runs are pointless, so cancel them. Pushes to main are NOT
# cancelled - killing a run mid-rsync would leave the served directory in a
# half-updated state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  DEPLOY_HOST: 87.106.19.210
  DEPLOY_USER: viktor
  DEPLOY_PATH: /var/www/playr-frontend
  SITE_URL: https://www.playr.viktorradman.se

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Deploy reuses this exact output rather than rebuilding, so what was
      # tested is what ships.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinning the host key. StrictHostKeyChecking=no would leave the
          # deploy open to man-in-the-middle.
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Smoke check
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$SITE_URL/")
          echo "GET / -> $code"
          test "$code" = "200"

          type=$(curl -sS -o /dev/null -w '%{content_type}' "$SITE_URL/api/games")
          echo "GET /api/games -> $type"
          case "$type" in
            application/json*) ;;
            *) echo "API is not returning JSON"; exit 1 ;;
          esac

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
